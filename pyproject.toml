[project]
name = "ai-research-assistant"
version = "0.1.0"
description = "Retrieval-augmented document Q&A service — FastAPI + LangChain ingestion, chunking, and TF-IDF vector retrieval, with LLM grounded synthesis and cited sources. Ships as one Docker image with its own frontend."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "python-dotenv>=1.0",
    "python-multipart>=0.0.9",
    "langchain-core>=0.3.0",
    "langchain-text-splitters>=0.3.0",
    "langchain-groq>=0.2.0",
    "scikit-learn>=1.5",
    "numpy>=1.26",
    "pypdf>=4.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
